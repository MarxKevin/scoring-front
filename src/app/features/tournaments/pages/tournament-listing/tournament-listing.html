<div class="flex justify-between ">
    <h1>Tournament List</h1>
    <div>
        <app-button
            icon="plus"
            variant="primary"
            (clicked)="openCreateModal()">
                Add
        </app-button>
    </div>
    
</div>


<div class="">
    @for(tournament of tournamentsList(); track tournament.id){
        <div class="tournament-thumbnail-wrapper">
            <button (click)="goToTournament(tournament.id)" class="tournament-thumbnail">
                {{tournament.name}}    
            </button>

            <app-tag [variant]="statusConfig[tournament.status].variant">
                {{ statusConfig[tournament.status].label }}
            </app-tag>
            <app-button
                icon="trash"
                variant="danger"
                iconOnly
                (clicked)="deleteTournament(tournament.id)"></app-button>
        </div>
    }

</div>

<app-modal
    [open]="isModalOpen()"
    title="Create new tournament"
    (closed)="closeModal()">

    <app-tournament-form
        (submitted)="createTournament($event)"
        (cancelled)="closeModal()"
    />

</app-modal>
