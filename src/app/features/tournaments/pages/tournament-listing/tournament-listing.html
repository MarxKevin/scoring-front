<div class="flex justify-between ">
    <h1>Tournament List</h1>
    <div>
        <app-button
            icon="plus"
            variant="primary"
            (clicked)="toggleCreationModal(true)">
                Add
        </app-button>
    </div>
    
</div>


<div class="">
    @for(tournament of tournamentsList(); track tournament.id){
        <div class="tournament-thumbnail-wrapper">
            <button (click)="goToTournament(tournament.id)" class="tournament-thumbnail">
                {{tournament.name}}    
            </button>

            @let status = getStatus(tournament);

            <app-tag [variant]="getStatusVariant(status)">
                {{ getStatusLabel(status) }}
            </app-tag>
            <span class="thumbnail-delete">
                <button (click)="deleteTournament(tournament.id)" class="button -error -small">
                    Delete
                </button>
            </span>
        </div>
    }

</div>
@if (showCreationModal) {
    <app-modal>
        <form [formGroup]="tournamentCreationForm" (ngSubmit)="addTournament()">
            <label for="name">Tournament name: </label>
            <input id="name" type="text" formControlName="name" required/>
            <button type="submit" [disabled]="!tournamentCreationForm.valid" class="button -primary -small">Submit</button>
        </form>

    </app-modal>
    <div class="modal creation-modal" >
        <button (click)="toggleCreationModal(false)">
            X
        </button>
        
    </div>
}
