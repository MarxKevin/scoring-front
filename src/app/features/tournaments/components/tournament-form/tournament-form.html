<form
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  class="space-y-6"
>
  <!-- Nom -->
  <div class="space-y-2">
    <label
      for="name"
      class="block text-sm font-medium text-gray-700"
    >
      Nom du tournoi
    </label>

    <input
      id="name"
      type="text"
      formControlName="name"
      placeholder="Ex. Tournoi EVA Liège"
      class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-gray-900 outline-none transition placeholder:text-gray-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20"
    />

    @if (
      form.controls.name.invalid &&
      form.controls.name.touched
    ) {
      <p class="text-sm text-red-600">
        Le nom du tournoi est obligatoire.
      </p>
    }
  </div>

  <!-- Statut -->
  <div class="space-y-2">
    <label
      for="status"
      class="block text-sm font-medium text-gray-700"
    >
      Statut
    </label>

    <select
      id="status"
      formControlName="status"
      class="w-full rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-gray-900 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20"
    >
      @for (status of statuses; track status[0]) {
        <option [value]="status[0]">
          {{ status[1].label }}
        </option>
      }
    </select>
  </div>

  <!-- Actions -->
  <div
    class="flex justify-end gap-3 border-t border-gray-200 pt-6"
  >
    <button
      type="button"
      class="rounded-lg border border-gray-300 px-4 py-2.5 text-sm font-medium text-gray-700 transition hover:bg-gray-50"
      (click)="onCancel()"
    >
      Annuler
    </button>

    <button
      type="submit"
      class="rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-medium text-white transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
    >
      Enregistrer
    </button>
  </div>
</form>
